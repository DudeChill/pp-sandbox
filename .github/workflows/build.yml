name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test details
        run: ./build/pp_tests
      - name: Bench
        run: ./build/pp_bench
      - name: Runtime smoke test
        run: ./build/pp --self-test

  windows-fetch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure without vcpkg (auto-fetch SDL2)
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows --target pp -j2
      - name: Runtime smoke test
        shell: cmd
        run: |
          build\windows\Release\pp.exe --self-test
          echo EXITCODE=%ERRORLEVEL%

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release -j2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test details
        run: ./build/Release/pp_tests.exe
      - name: Bench
        run: ./build/Release/pp_bench.exe
      - name: Stage runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/pp.exe dist/
          Copy-Item build/Release/*.dll dist/ -ErrorAction SilentlyContinue
          $crt = @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll','concrt140.dll')
          foreach ($dll in $crt) {
            $p = Join-Path $env:WINDIR "System32/$dll"
            if (Test-Path $p) { Copy-Item $p dist/ }
          }
          Get-ChildItem dist
      - name: Runtime smoke test
        shell: cmd
        run: |
          dist\pp.exe --self-test
          echo EXITCODE=%ERRORLEVEL%

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: pp-windows-x64
          path: dist/
          if-no-files-found: error
